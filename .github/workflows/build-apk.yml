name: "Build and Release Android APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout Clean Repository"
        uses: actions/checkout@v4

      - name: "2. Setup Node.js 24 Environment"
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: "3. Setup pnpm Package Manager"
        run: |
          corepack enable
          corepack prepare pnpm@11.23.0 --activate || npm install -g pnpm@latest --force

      - name: "4. Setup Java JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: "5. Accept Android SDK Licenses"
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: "6. Ensure Workspace Integrity"
        run: |
          if [ -f "pnpm-workspace.yaml" ]; then
            grep -q "packages:" pnpm-workspace.yaml || echo -e "packages:\n  - '.'" >> pnpm-workspace.yaml
          fi

      - name: "7. Purge Dev Client Package"
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("package.json")) {
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              if (pkg.dependencies && pkg.dependencies["expo-dev-client"]) delete pkg.dependencies["expo-dev-client"];
              if (pkg.devDependencies && pkg.devDependencies["expo-dev-client"]) delete pkg.devDependencies["expo-dev-client"];
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
              console.log("Purged expo-dev-client dependencies cleanly.");
            }
          '

      - name: "8. Patch App Name and Black Splash in Configs"
        run: |
          node -e '
            const fs = require("fs");
            
            if (fs.existsSync("app.config.js")) {
              let config = fs.readFileSync("app.config.js", "utf8");
              config = config.replace(/name:\s*["\x27]Bluesky["\x27]/g, "name: \"Deducia\"");
              config = config.replace(/#002b75/gi, "#000000");
              fs.writeFileSync("app.config.js", config);
              console.log("Patched app.config.js.");
            }

            if (fs.existsSync("app.json")) {
              let appJson = fs.readFileSync("app.json", "utf8");
              appJson = appJson.replace(/"name":\s*"Bluesky"/g, "\"name\": \"Deducia\"");
              appJson = appJson.replace(/#002b75/gi, "#000000");
              fs.writeFileSync("app.json", appJson);
              console.log("Patched app.json fallback.");
            }
          '

      - name: "9. Locate and Stage Fox Logo"
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".");
            const logoMatch = files.find(f => /^(ic[_\s-]?launcher|logo|ic)\.png$/i.test(f));

            if (logoMatch) {
              console.log("Found logo file:", logoMatch);
              if (!fs.existsSync("assets")) fs.mkdirSync("assets");
              fs.copyFileSync(logoMatch, "assets/icon.png");
              fs.copyFileSync(logoMatch, "assets/splash.png");
              fs.copyFileSync(logoMatch, "assets/bootsplash_logo.png");
              fs.copyFileSync(logoMatch, "assets/icon-android-foreground.png");
              
              // Also overwrite any butterfly or logo assets in assets folder
              fs.readdirSync("assets").forEach(f => {
                if (/butterfly|logo/i.test(f) && f.endsWith(".png")) {
                  fs.copyFileSync(logoMatch, "assets/" + f);
                }
              });
            } else {
              console.log("Warning: No custom logo found matching pattern in root.");
            }
          '

      - name: "10. Generate Standalone Google Services Configuration"
        run: |
          node -e '
            const fs = require("fs");
            let pkgName = "xyz.blueskyweb.app";
            try {
              if (fs.existsSync("app.json")) {
                const appJson = JSON.parse(fs.readFileSync("app.json", "utf8"));
                pkgName = appJson.expo?.android?.package || appJson.android?.package || pkgName;
              }
            } catch(e) {}

            const dummyGoogleServices = {
              "project_info": {
                "project_number": "123456789000",
                "project_id": "deducia-social",
                "storage_bucket": "deducia-social.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789000:android:0123456789abcdef",
                    "android_client_info": { "package_name": pkgName }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildValidationOnly123456" }],
                  "services": {}
                }
              ],
              "configuration_version": "1"
            };

            fs.writeFileSync("google-services.json", JSON.stringify(dummyGoogleServices, null, 2));
            console.log("Generated google-services.json cleanly.");
          '

      - name: "11. Apply Deducia Isolation, Header Logo & Chat Unlock"
        run: |
          cat << 'EOF' > patch_step.js
          const fs = require('fs');
          const path = require('path');

          function walk(dir, callback) {
            if (!fs.existsSync(dir)) return;
            fs.readdirSync(dir).forEach(file => {
              const full = path.join(dir, file);
              if (fs.statSync(full).isDirectory()) {
                if (!['node_modules', '.git', 'android', 'ios'].includes(file)) walk(full, callback);
              } else {
                callback(full, file);
              }
            });
          }

          // A. Load Fox Logo into Base64 for React Native header rendering
          let logoBase64 = '';
          const files = fs.readdirSync('.');
          const logoMatch = files.find(f => /^(ic[_\s-]?launcher|logo|ic)\.png$/i.test(f));
          if (logoMatch) {
            logoBase64 = 'data:image/png;base64,' + fs.readFileSync(logoMatch).toString('base64');
            console.log('Loaded Fox logo into Base64.');
          }

          // B. Replace Top Bar Header Butterfly & Logo with Fox Logo
          walk('src', (full, file) => {
            if (file === 'Butterfly.tsx' || file === 'Butterfly.js' || file === 'Logo.tsx' || file === 'Logo.js') {
              const safeHeaderLogo = `
                import React from "react";
                import { Image } from "react-native";
                const LOGO_URI = "${logoBase64}";
                export function Butterfly({ width = 32, height, style }: any) {
                  const size = width || 32;
                  if (!LOGO_URI) return null;
                  return (
                    <Image
                      source={{ uri: LOGO_URI }}
                      style={[{ width: size, height: height || size, resizeMode: "contain" }, style]}
                    />
                  );
                }
                export const Logo = Butterfly;
                export default Butterfly;
              `;
              fs.writeFileSync(full, safeHeaderLogo);
              console.log('Replaced Header Logo component in:', full);
            }
          });

          // C. Lock Server Endpoints in constants.ts
          walk('src/lib', (full, file) => {
            if (/constants\.(ts|js)$/.test(file)) {
              let code = fs.readFileSync(full, 'utf8');
              code = code.replace(/BSKY_SERVICE\s*=\s*['"][^'"]+['"]/g, 'BSKY_SERVICE = "https://pds.deducia.com"');
              code = code.replace(/DEFAULT_SERVICE\s*=\s*[^;\n]+/g, 'DEFAULT_SERVICE = "https://pds.deducia.com"');
              code = code.replace(/BSKY_SERVICE_DID\s*=\s*['"][^'"]+['"]/g, 'BSKY_SERVICE_DID = "did:web:pds.deducia.com"');
              fs.writeFileSync(full, code);
              console.log('Locked server to pds.deducia.com in:', full);
            }
          });

          // D. Bulletproof Feed Isolation & Eliminate Infinite Spinner
          walk('src/state/queries', (full, file) => {
            if (file === 'post-feed.ts' || file === 'post-feed.js') {
              let code = fs.readFileSync(full, 'utf8');
              if (!code.includes('isDeduciaHandle')) {
                const helper = `
                  const isDeduciaHandle = (handle) => {
                    if (!handle) return false;
                    return handle.endsWith('.deducia.com') || handle === 'deducia.com';
                  };
                `;
                // Add helper at top
                code = helper + code;

                // Safely filter any returned feed items and reset cursor when empty
                code = code.replace(
                  /feed:\s*res\.data\.feed/g,
                  'feed: (res.data.feed || []).filter(item => isDeduciaHandle(item?.post?.author?.handle)), cursor: ((res.data.feed || []).filter(item => isDeduciaHandle(item?.post?.author?.handle)).length > 0 ? res.data.cursor : undefined)'
                );
                code = code.replace(
                  /feed:\s*data\.feed/g,
                  'feed: (data.feed || []).filter(item => isDeduciaHandle(item?.post?.author?.handle)), cursor: ((data.feed || []).filter(item => isDeduciaHandle(item?.post?.author?.handle)).length > 0 ? data.cursor : undefined)'
                );
                fs.writeFileSync(full, code);
                console.log('Injected bulletproof feed isolation and killed infinite spinner in:', full);
              }
            }
          });

          // E. Remove Explore Recommendations, Trending & Starter Packs
          walk('src/state/queries', (full, file) => {
            if (file === 'suggested-follows.ts' || file === 'suggested-follows.js') {
              let code = fs.readFileSync(full, 'utf8');
              code = code.replace(/data\.suggestions/g, '[]');
              code = code.replace(/suggestions:\s*[^,\n}]+/g, 'suggestions: []');
              fs.writeFileSync(full, code);
              console.log('Cleared suggested follows in:', full);
            } else if (file === 'starter-packs.ts' || file === 'starter-packs.js') {
              let code = fs.readFileSync(full, 'utf8');
              code = code.replace(/starterPacks:\s*[^,\n}]+/g, 'starterPacks: []');
              code = code.replace(/items:\s*[^,\n}]+/g, 'items: []');
              fs.writeFileSync(full, code);
              console.log('Cleared starter packs in:', full);
            } else if (file.includes('trending') && /\.(ts|js)$/.test(file)) {
              let code = fs.readFileSync(full, 'utf8');
              code = code.replace(/topics:\s*[^,\n}]+/g, 'topics: []');
              code = code.replace(/items:\s*[^,\n}]+/g, 'items: []');
              fs.writeFileSync(full, code);
              console.log('Cleared trending queries in:', full);
            } else if (file === 'actor-search.ts' || file === 'actor-search.js') {
              let code = fs.readFileSync(full, 'utf8');
              if (!code.includes('isDeduciaHandle')) {
                code = `const isDeduciaHandle = (h) => Boolean(h && (h.endsWith('.deducia.com') || h === 'deducia.com'));\n` + code;
                code = code.replace(/items:\s*res\.actors/g, 'items: (res.actors || []).filter(a => isDeduciaHandle(a?.handle))');
                fs.writeFileSync(full, code);
                console.log('Restricted actor search to deducia.com in:', full);
              }
            }
          });

          // F. Unblock Age Assurance on Chats (Hyphen & CamelCase matching)
          walk('src', (full, file) => {
            if (/age[-_]?assurance/i.test(full) || /AgeAssurance/i.test(file)) {
              let code = fs.readFileSync(full, 'utf8');
              code = code.replace(/canAccessChat:\s*false/g, 'canAccessChat: true');
              code = code.replace(/status:\s*['"]error['"]/g, 'status: "ready"');
              code = code.replace(/status:\s*['"]pending['"]/g, 'status: "ready"');
              code = code.replace(/isVerified:\s*false/g, 'isVerified: true');
              code = code.replace(/isEligible:\s*false/g, 'isEligible: true');
              fs.writeFileSync(full, code);
              console.log('Unblocked Age Assurance in:', full);
            }
          });

          // G. Neutralize Gate Component in Messages
          walk('src/screens/Messages', (full, file) => {
            if (/gate/i.test(file) && /\.(tsx|jsx)$/.test(file)) {
              const cleanGate = `
                import React from "react";
                export function Gate({ children }: any) {
                  return children;
                }
                export const AgeAssuranceGate = Gate;
                export default Gate;
              `;
              fs.writeFileSync(full, cleanGate);
              console.log('Replaced Messages Gate component in:', full);
            }
          });

          console.log('All patches applied cleanly.');
          EOF
          node patch_step.js
          rm patch_step.js

      - name: "12. Install Repository Dependencies"
        run: pnpm install --no-frozen-lockfile

      - name: "13. Compile Lingui Localization Catalogs"
        run: |
          pnpm run intl:build || pnpm run intl:compile || pnpm exec lingui compile || npx @lingui/cli compile || true

          node -e '
            const fs = require("fs");
            const path = require("path");
            const localesDir = path.join("src", "locale", "locales");
            if (fs.existsSync(localesDir)) {
              fs.readdirSync(localesDir).forEach(dir => {
                const sub = path.join(localesDir, dir);
                if (fs.statSync(sub).isDirectory()) {
                  const targetJs = path.join(sub, "messages.js");
                  const targetTs = path.join(sub, "messages.ts");
                  if (!fs.existsSync(targetJs) && !fs.existsSync(targetTs)) {
                    fs.writeFileSync(targetJs, "export const messages = {};\n");
                  }
                }
              });
            }
          '

      - name: "14. Generate Native Android Project (Expo Clean Prebuild)"
        run: npx expo prebuild --platform android --clean

      - name: "15. Enforce Native Android Assets & Drawables"
        run: |
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Deducia</string>|g' "$STRINGS_FILE"
            echo "Enforced Deducia in strings.xml"
          fi

          COLORS_FILE="android/app/src/main/res/values/colors.xml"
          if [ -f "$COLORS_FILE" ]; then
            sed -i 's|<color name="bootsplash_background">.*</color>|<color name="bootsplash_background">#000000</color>|g' "$COLORS_FILE"
            echo "Enforced #000000 in colors.xml"
          fi

          node -e '
            const fs = require("fs");
            const path = require("path");

            const files = fs.readdirSync(".");
            const logoMatch = files.find(f => /^(ic[_\s-]?launcher|logo|ic)\.png$/i.test(f));

            if (logoMatch && fs.existsSync("android/app/src/main/res")) {
              console.log("Replacing native drawables with:", logoMatch);
              function walkDir(dir) {
                fs.readdirSync(dir).forEach(file => {
                  const full = path.join(dir, file);
                  if (fs.statSync(full).isDirectory()) {
                    walkDir(full);
                  } else if (/^(bootsplash_logo|ic_launcher).*\.png$/i.test(file)) {
                    fs.copyFileSync(logoMatch, full);
                  }
                });
              }
              walkDir("android/app/src/main/res");
            }
          '

      - name: "16. Compile Standalone Android Release APK"
        run: |
          cd android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx4096m -Dfile.encoding=UTF-8"
          ./gradlew assembleRelease -x lint -x lintVitalRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: "17. Locate Compiled Standalone APK"
        id: find-apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: "18. Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: deducia-standalone-apk
          path: ${{ steps.find-apk.outputs.apk_path }}

      - name: "19. Publish Official GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Deducia Social v1.0.0 (Build ${{ github.run_number }})"
          body: "Official standalone release of Deducia. Feeds isolated to @*.deducia.com, chat unlocked, Fox header logo active, and infinite spinner loop eliminated."
          files: ${{ steps.find-apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
